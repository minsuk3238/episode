<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>스누피가든 야외 도슨트 프리뷰</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- NanumSquare Font CDN for beautiful Korean typography -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css" />
    
    <style>
        /* --- CUSTOM FONTS INTEGRATION --- */
        
        /* 1. 영문 및 숫자 전용 피너츠 손글씨 폰트 (Schulz.otf) */
        @font-face {
            font-family: 'PeanutsSchulz';
            src: url('Schulz.otf') format('opentype'),
                 url('fonts/Schulz.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        /* 2. 우드스탁 전용 빗금 대화 폰트 (Woodstock Talk.otf) */
        @font-face {
            font-family: 'WoodstockTalk';
            src: url('Woodstock Talk.otf') format('opentype'),
                 url('fonts/Woodstock Talk.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            /* 영문/숫자는 PeanutsSchulz로 우선 매핑, 한글은 NanumSquare로 매핑되도록 디자인 설정 */
            font-family: 'PeanutsSchulz', 'NanumSquare', sans-serif;
            background-color: #e2e8f0; /* Soft background for desktop */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* 우드스탁 전용 텍스트 스타일 정의 */
        .font-woodstock {
            font-family: 'WoodstockTalk', sans-serif !important;
        }

        /* Mobile App Container Simulation */
        #app-container {
            width: 100%;
            max-width: 414px; /* iPhone Max width */
            height: 100vh;
            max-height: 896px;
            background-color: #f8fafc;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        @media (min-width: 415px) {
            #app-container {
                height: 90vh;
                border-radius: 2rem;
            }
        }

        /* Smooth page transitions */
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f8fafc;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
            z-index: 10;
            display: flex;
            flex-direction: column;
        }

        .page-hidden-right {
            transform: translateX(100%);
            opacity: 0;
            pointer-events: none;
        }

        .page-hidden-left {
            transform: translateX(-100%);
            opacity: 0;
            pointer-events: none;
        }

        .page-active {
            transform: translateX(0);
            opacity: 1;
            pointer-events: auto;
        }

        /* Story reveal animation */
        .story-content {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.8s ease-in-out, opacity 0.6s ease-in-out;
        }

        .story-content.revealed {
            max-height: 1000px; /* Arbitrary large number */
            opacity: 1;
        }

        /* Custom Scrollbar for story area */
        .scrollable-area::-webkit-scrollbar {
            width: 6px;
        }
        .scrollable-area::-webkit-scrollbar-track {
            background: transparent;
        }
        .scrollable-area::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 20px;
        }

        /* Pulsing interaction button */
        @keyframes pulse-soft {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .btn-interact {
            animation: pulse-soft 2s infinite;
        }
    </style>
</head>
<body>

                <div class="absolute inset-0 opacity-20" style="background-image: radial-gradient(circle at 2px 2px, black 1px, transparent 0); background-size: 20px 20px;"></div>
                
                <div class="w-28 h-28 rounded-2xl flex items-center justify-center text-3xl flex-shrink-0 shadow-lg relative overflow-hidden mb-4 bg-white bg-opacity-70">
                    <img id="detail-img" src="" alt="Spot Image" class="w-full h-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div id="detail-img-fallback" class="hidden flex items-center justify-center w-full h-full text-gray-700 font-extrabold text-3xl"></div>
                </div>

                <h2 id="detail-title" class="text-2xl font-black text-gray-900 relative z-10 text-center px-4">타이틀</h2>
                <p id="detail-subtitle" class="text-gray-700 mt-2 font-medium relative z-10 bg-white bg-opacity-40 px-3 py-0.5 rounded-full text-sm">서브타이틀</p>
            </div>

            <!-- Interaction Area -->
            <div class="px-6 py-8 flex-1 flex flex-col items-center bg-white rounded-t-3xl -mt-6 z-20 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)]">
                
                <!-- Interaction Button -->
                <div id="interaction-zone" class="w-full flex flex-col items-center justify-center my-8">
                    <p class="text-sm text-gray-400 mb-4 font-medium text-center">해당 구역에 도착하셨나요?<br>아래 버튼을 눌러 스토리를 확인하세요.</p>
                    <button onclick="revealStory()" class="btn-interact bg-gray-900 text-white font-bold py-4 px-8 rounded-full shadow-lg hover:bg-black transition-all flex items-center space-x-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
                        </svg>
                        <span>에피소드 확인하기</span>
                    </button>
                </div>

                <!-- Story Content -->
                <div id="story-container" class="story-content w-full text-left">
                    <div class="w-12 h-1 bg-gray-200 rounded-full mb-6"></div>
                    <div id="story-text" class="text-gray-700 leading-relaxed text-base break-keep">
                        <!-- Text injected here -->
                    </div>
                    
                    <!-- Bottom Navigation -->
                    <div class="mt-12 mb-8 pt-6 border-t border-gray-100 flex justify-between items-center w-full">
                        <button onclick="navigateBack()" class="text-gray-500 font-medium hover:text-gray-900">목록으로</button>
                        <button id="next-spot-btn" onclick="goToNextSpot()" class="text-blue-600 font-bold hover:text-blue-800 flex items-center">
                            다음 장소 <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-1" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script>
    let currentSpotIndex = 0;
    let unlockedSpotIndex = 0;
    let isTyping = false; 
    let typeTimeouts = [];
    let currentStoryHtml = "";
    
    // --- Audio Context for Typewriter Sound ---
    let audioCtx;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    document.addEventListener('click', function() {
        initAudio();
    }, { once: true });
    
    document.addEventListener('touchstart', function() {
        initAudio();
    }, { once: true });

    function playTypeClickSound() {
        if (!audioCtx || audioCtx.state !== 'running') return;
        const t = audioCtx.currentTime;
        
        // 갈축 키보드의 '도각'거리는 묵직한 타격음 구현
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'square'; // 약간의 마찰음 느낌을 주는 파형
        osc.frequency.setValueAtTime(250, t); // 250Hz로 낮춰 묵직하게 설정
        osc.frequency.exponentialRampToValueAtTime(100, t + 0.02);
        
        gain.gain.setValueAtTime(0.08, t); // 볼륨 조절
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.02); 
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start(t);
        osc.stop(t + 0.03);
    }
    // -----------------------------------------

    // Elements
    const homePage = document.getElementById('home-page');
    const detailPage = document.getElementById('detail-page');
    const listContainer = document.getElementById('list-container');
    
    const detailHero = document.getElementById('detail-hero');
    const detailImg = document.getElementById('detail-img');
    const detailImgFallback = document.getElementById('detail-img-fallback');
    const detailTitle = document.getElementById('detail-title');
    const detailSubtitle = document.getElementById('detail-subtitle');
    const storyText = document.getElementById('story-text');
    const storyContainer = document.getElementById('story-container');
    const interactionZone = document.getElementById('interaction-zone');
    const nextSpotBtn = document.getElementById('next-spot-btn');

    function initList() {
        listContainer.innerHTML = '';
        tourData.forEach((spot, index) => {
            const card = document.createElement('div');
            card.id = `spot-card-${index}`;
            listContainer.appendChild(card);
        });
        updateListUI();
    }

    function updateListUI() {
        tourData.forEach((spot, index) => {
            const isLocked = index > unlockedSpotIndex;
            const card = document.getElementById(`spot-card-${index}`);
            
            let cardClass = `bg-white rounded-2xl p-4 mb-3 shadow-sm border border-gray-100 flex items-center space-x-4 transition-all duration-300 transform `;
            if (isLocked) {
                cardClass += `opacity-60 grayscale cursor-not-allowed bg-gray-50`;
                card.onclick = null;
            } else {
                cardClass += `cursor-pointer hover:shadow-md active:scale-[0.98]`;
                card.onclick = () => openDetail(index);
            }
            card.className = cardClass;
            
            const iconOrLock = isLocked 
                ? `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>`
                : `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-300" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" /></svg>`;

            card.innerHTML = `
                <div class="w-14 h-14 rounded-xl flex items-center justify-center text-xl flex-shrink-0 shadow-inner relative overflow-hidden" style="background-color: ${spot.color}">
                    <img src="${spot.imageName}" alt="${spot.title}" class="w-full h-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="hidden flex items-center justify-center w-full h-full text-gray-600 font-extrabold text-lg">${spot.id}</div>
                    ${isLocked ? `<div class="absolute inset-0 bg-white bg-opacity-40 rounded-xl"></div>` : ''}
                </div>
                <div class="flex-1">
                    <p class="text-xs text-gray-400 font-bold mb-0.5">Spot ${spot.id}</p>
                    <h3 class="text-gray-800 font-bold text-lg leading-tight">${spot.title}</h3>
                </div>
                <div class="text-gray-300 flex flex-col items-center">
                    ${isLocked ? `<span class="text-[10px] text-gray-400 font-bold mb-1">잠김</span>` : ''}
                    ${iconOrLock}
                </div>
            `;
        });
    }

    function openDetail(index) {
        if (index > unlockedSpotIndex) return;
        
        currentSpotIndex = index;
        const spot = tourData[index];

        storyContainer.classList.remove('revealed');
        interactionZone.style.display = 'flex';
        
        storyText.innerHTML = "";
        storyText.classList.add('cursor-pointer');
        storyText.title = "클릭하여 텍스트 모두 보기 (스킵)";
        currentStoryHtml = spot.text;
        isTyping = false;
        clearTypingTimeouts();
        nextSpotBtn.style.display = 'none';
        
        detailHero.style.backgroundColor = spot.color;
        
        if (spot.color === "#40b049") {
            detailTitle.className = "text-2xl font-black text-white relative z-10 text-center px-4 drop-shadow-sm";
            detailSubtitle.className = "text-white mt-2 font-semibold relative z-10 bg-black bg-opacity-20 px-3 py-0.5 rounded-full text-sm";
        } else {
            detailTitle.className = "text-2xl font-black text-gray-900 relative z-10 text-center px-4";
            detailSubtitle.className = "text-gray-700 mt-2 font-medium relative z-10 bg-white bg-opacity-50 px-3 py-0.5 rounded-full text-sm";
        }

        detailImg.style.display = 'block';
        detailImg.src = spot.imageName;
        detailImgFallback.style.display = 'none';
        detailImgFallback.innerHTML = spot.id;
        
        detailTitle.innerHTML = spot.title;
        detailSubtitle.innerHTML = spot.subtitle;

        homePage.classList.remove('page-active');
        homePage.classList.add('page-hidden-left');
        
        detailPage.classList.remove('page-hidden-right');
        detailPage.classList.add('page-active');
    }

    function navigateBack() {
        clearTypingTimeouts();
        isTyping = false;
        
        detailPage.classList.remove('page-active');
        detailPage.classList.add('page-hidden-right');
        
        homePage.classList.remove('page-hidden-left');
        homePage.classList.add('page-active');
    }

    function revealStory() {
        initAudio();
        interactionZone.style.display = 'none';
        storyContainer.classList.add('revealed');
        
        setTimeout(() => {
            startTypewriter(currentStoryHtml);
        }, 300);
    }

    function clearTypingTimeouts() {
        typeTimeouts.forEach(clearTimeout);
        typeTimeouts = [];
    }

    function startTypewriter(html) {
        isTyping = true;
        storyText.innerHTML = '';
        
        let tokens = html.match(/(<.*?>|[^<]+)/g); 
        if(!tokens) {
            onTypewriterComplete();
            return;
        }
        
        let tokenIndex = 0;
        let charIndex = 0;
        let currentHtml = '';
        const baseTypingSpeed = 65; // 전체적으로 천천히 타이핑되게 속도 조정

        function type() {
            if (!isTyping) return;

            if (tokenIndex >= tokens.length) {
                onTypewriterComplete();
                return;
            }

            let token = tokens[tokenIndex];
            if (token.startsWith('<')) {
                currentHtml += token;
                storyText.innerHTML = currentHtml;
                tokenIndex++;
                type(); 
            } else {
                if (charIndex < token.length) {
                    const char = token.charAt(charIndex);
                    currentHtml += char;

                    if (char.trim() !== '') {
                        playTypeClickSound();
                    }

                    storyText.innerHTML = currentHtml + '<span class="inline-block w-1 h-4 ml-0.5 align-middle bg-gray-500 animate-pulse"></span>'; 
                    charIndex++;
                    
                    const scrollArea = document.querySelector('.scrollable-area');
                    if(scrollArea) scrollArea.scrollTop = scrollArea.scrollHeight;
                    
                    // 0~40ms의 무작위 딜레이를 더해 사람이 타자를 치는 듯한 불규칙한 리듬 생성
                    const humanizeDelay = Math.floor(Math.random() * 40);
                    let timeoutId = setTimeout(type, baseTypingSpeed + humanizeDelay);
                    typeTimeouts.push(timeoutId);
                } else {
                    charIndex = 0;
                    tokenIndex++;
                    type();
                }
            }
        }
        
        type();
    }

    storyText.onclick = function() {
        if (isTyping) {
            isTyping = false;
            clearTypingTimeouts();
            storyText.innerHTML = currentStoryHtml;
            onTypewriterComplete();
            
            setTimeout(() => {
                const scrollArea = document.querySelector('.scrollable-area');
                if(scrollArea) scrollArea.scrollTop = scrollArea.scrollHeight;
            }, 50);
        }
    };

    function onTypewriterComplete() {
        isTyping = false;
        storyText.classList.remove('cursor-pointer');
        storyText.title = "";
        storyText.innerHTML = currentStoryHtml; 
        
        if (currentSpotIndex >= unlockedSpotIndex && unlockedSpotIndex < tourData.length - 1) {
            unlockedSpotIndex = currentSpotIndex + 1;
            updateListUI(); 
        }

        if (currentSpotIndex < tourData.length - 1) {
            nextSpotBtn.style.display = 'flex';
            nextSpotBtn.style.opacity = '0';
            nextSpotBtn.style.transform = 'translateY(10px)';
            setTimeout(() => {
                nextSpotBtn.style.transition = 'all 0.4s ease';
                nextSpotBtn.style.opacity = '1';
                nextSpotBtn.style.transform = 'translateY(0)';
            }, 50);
        } else {
            nextSpotBtn.style.display = 'none';
        }
        
        setTimeout(() => {
             const scrollArea = document.querySelector('.scrollable-area');
             if(scrollArea) scrollArea.scrollTo({ top: scrollArea.scrollHeight, behavior: 'smooth' });
        }, 100);
    }

    function goToNextSpot() {
        if (currentSpotIndex < tourData.length - 1 && currentSpotIndex + 1 <= unlockedSpotIndex) {
            detailPage.style.opacity = '0';
            
            setTimeout(() => {
                openDetail(currentSpotIndex + 1);
                detailPage.style.opacity = '1';
            }, 300);
        }
    }

    window.onload = function() {
        initList();
    };
</script>

</body>
</html>
