        /* --- CUSTOM FONTS INTEGRATION --- */
        
        @font-face {
            font-family: 'PeanutsSchulz';

            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'WoodstockTalk';
            src: url('Woodstock Talk.otf') format('opentype'),
                 url('fonts/Woodstock Talk.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'PeanutsSchulz', 'NanumSquare', sans-serif;
            background-color: #e2e8f0; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        .font-woodstock {
            font-family: 'WoodstockTalk', sans-serif !important;
        }

        #app-container {
            width: 100%;
            max-width: 414px; 
            height: 100vh;
            max-height: 896px;
            background-color: #f8fafc;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        @media (min-width: 415px) {
            #app-container {
                height: 90vh;
                border-radius: 2rem;
            }
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f8fafc;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
            z-index: 10;
            display: flex;
            flex-direction: column;
        }

        .page-hidden-right { transform: translateX(100%); opacity: 0; pointer-events: none; }
        .page-hidden-left { transform: translateX(-100%); opacity: 0; pointer-events: none; }
        .page-active { transform: translateX(0); opacity: 1; pointer-events: auto; }

        .story-content {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.8s ease-in-out, opacity 0.6s ease-in-out;
        }
        .story-content.revealed { max-height: 1000px; opacity: 1; }

        .scrollable-area::-webkit-scrollbar { width: 6px; }
        .scrollable-area::-webkit-scrollbar-track { background: transparent; }
        .scrollable-area::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }

        @keyframes pulse-soft {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .btn-interact { animation: pulse-soft 2s infinite; }

<script>
    // --- 1. 상태 및 오디오 변수 ---
    let currentSpotIndex = 0;
    // 초기값을 -1로 변경하여 기본적으로 모든 스팟(1번 포함)이 잠금 상태가 되도록 함.
    let unlockedSpotIndex = parseInt(localStorage.getItem('snoopyUnlockedSpot') || '-1'); 
    let isTyping = false; 
    let typeTimeouts = [];
    let currentStoryHtml = "";
    
    let audioCtx;
    let typingSoundInterval = null;

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    document.addEventListener('click', initAudio, { once: true });
    document.addEventListener('touchstart', initAudio, { once: true });

    function playTypewriterSound() {
        if (!audioCtx || audioCtx.state !== 'running') return;
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle'; 
        osc.frequency.setValueAtTime(120, t); 
        osc.frequency.exponentialRampToValueAtTime(30, t + 0.05);
        gain.gain.setValueAtTime(0.15, t); 
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05); 
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.06);
    }

    function startTypingSound() {
        if (typingSoundInterval) clearInterval(typingSoundInterval);
        playTypewriterSound(); 
        typingSoundInterval = setInterval(playTypewriterSound, 150); 
    }

    function stopTypingSound() {
        if (typingSoundInterval) {
            clearInterval(typingSoundInterval);
            typingSoundInterval = null;
        }
    }

    // --- 2. 엘리먼트 맵핑 ---
    const homePage = document.getElementById('home-page');
    const detailPage = document.getElementById('detail-page');
    const listContainer = document.getElementById('list-container');
    
    const detailHero = document.getElementById('detail-hero');
    const detailImg = document.getElementById('detail-img');
    const detailImgFallback = document.getElementById('detail-img-fallback');
    const detailTitle = document.getElementById('detail-title');
    const detailSubtitle = document.getElementById('detail-subtitle');
    const storyText = document.getElementById('story-text');
    const storyContainer = document.getElementById('story-container');
    const interactionZone = document.getElementById('interaction-zone');
    const nextSpotBtn = document.getElementById('next-spot-btn');

    // --- 3. 초기화 및 로직 ---
    window.onload = function() { checkNfcTag(); };

    function checkNfcTag() {
        const urlParams = new URLSearchParams(window.location.search);
        const masterCode = urlParams.get('master');
        
        if (masterCode === 'peanuts') {
            unlockedSpotIndex = tourData.length - 1; 
            localStorage.setItem('snoopyUnlockedSpot', unlockedSpotIndex);
            alert("마스터 모드 활성화: 모든 에피소드가 잠금 해제되었습니다.");
            window.history.replaceState({}, document.title, window.location.pathname);
            initList();
            return;
        }

        const spotParam = urlParams.get('spot');

        if (spotParam) {
            const targetIndex = parseInt(spotParam) - 1; 
            
            if (!isNaN(targetIndex) && targetIndex >= 0 && targetIndex < tourData.length) {
                // unlockedSpotIndex가 처음(-1)일 때 타겟이 0(1번스팟)이면 0 <= 0 이 성립되어 열림.
                if (targetIndex <= unlockedSpotIndex + 1) {
                    if (targetIndex > unlockedSpotIndex) {
                        unlockedSpotIndex = targetIndex;
                        localStorage.setItem('snoopyUnlockedSpot', unlockedSpotIndex);
                    }
                    initList();
                    openDetail(targetIndex);
                    window.history.replaceState({}, document.title, window.location.pathname);
                    return;
                } else {
                    alert("순서대로 진행해주세요! 이전 장소의 이야기를 먼저 확인해야 합니다.");
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            }
        }
        initList();
    }

    function resetProgress() {
        if(confirm('진행 상황을 모두 초기화 하시겠습니까? 처음부터 다시 시작합니다.')) {
            localStorage.removeItem('snoopyUnlockedSpot');
            unlockedSpotIndex = -1; // 1번도 잠기도록 수정
            initList();
            alert('초기화 되었습니다.');
        }
    }

    function initList() {
        listContainer.innerHTML = '';
        
        // 로고 배너 & NFC 안내 버튼 영역
        const banner = document.createElement('div');
        banner.className = "w-full mb-5 cursor-pointer hover:scale-[0.98] transition-transform duration-200";
        banner.onclick = openNFCGuide;
        banner.innerHTML = `
            <div class="bg-white rounded-2xl p-5 shadow-sm border-2 border-blue-100 flex flex-col items-center justify-center text-center relative overflow-hidden">
                <div class="absolute -right-4 -top-4 w-16 h-16 bg-blue-50 rounded-full opacity-50"></div>
                <!-- snoopy_logo.png를 여기에 적용 -->
                <img src="snoopy_logo.png" alt="Snoopy Logo" class="h-14 object-contain mb-2 z-10" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <div class="hidden text-gray-700 font-black text-xl mb-2 z-10">스누피가든 NFC 투어</div>
                <div class="flex items-center gap-1.5 text-xs text-blue-600 font-bold bg-blue-50 px-3 py-1.5 rounded-full z-10">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" /></svg>
                    NFC 태그 방법 알아보기
                </div>
            </div>
        `;
        listContainer.appendChild(banner);

        // 스팟 리스트 렌더링
        tourData.forEach((spot, index) => {
            const card = document.createElement('div');
            card.id = `spot-card-${index}`;
            listContainer.appendChild(card);
        });
        
        updateListUI();
        updateDynamicMapPath(); // 지도 동선 정보도 최신 잠금상태와 동기화
    }

    function updateListUI() {
        tourData.forEach((spot, index) => {
            const isLocked = index > unlockedSpotIndex;
            const card = document.getElementById(`spot-card-${index}`);
            
            let cardClass = `bg-white rounded-2xl p-4 mb-3 shadow-sm border border-gray-100 flex items-center space-x-4 transition-all duration-300 transform `;
            if (isLocked) {
                cardClass += `opacity-60 grayscale cursor-not-allowed bg-gray-50`;
                card.onclick = null;
            } else {
                cardClass += `cursor-pointer hover:shadow-md active:scale-[0.98]`;
                card.onclick = () => openDetail(index);
            }
            card.className = cardClass;
            
            const iconOrLock = isLocked 
                ? `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>`
                : `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-300" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" /></svg>`;

            card.innerHTML = `
                <div class="w-14 h-14 rounded-xl flex items-center justify-center text-xl flex-shrink-0 shadow-inner relative overflow-hidden" style="background-color: ${spot.color}">
                    <img src="${spot.imageName}" alt="${spot.title}" class="w-full h-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="hidden flex items-center justify-center w-full h-full text-gray-600 font-extrabold text-lg">${spot.id}</div>
                    ${isLocked ? `<div class="absolute inset-0 bg-white bg-opacity-40 rounded-xl"></div>` : ''}
                </div>
                <div class="flex-1">
                    <p class="text-xs text-gray-400 font-bold mb-0.5">Spot ${spot.id}</p>
                    <h3 class="text-gray-800 font-bold text-lg leading-tight">${spot.title}</h3>
                </div>
                <div class="text-gray-300 flex flex-col items-center">
                    ${isLocked ? `<span class="text-[10px] text-gray-400 font-bold mb-1">잠김</span>` : ''}
                    ${iconOrLock}
                </div>
            `;
        });
    }

    // (추가됨) 해제된 위치까지만 지도에 선을 그어주는 함수
    function updateDynamicMapPath() {
        const pathGroup = document.getElementById('dynamic-map-path-group');
        if (!pathGroup) return;
        
        pathGroup.innerHTML = ''; // 기존 패스 제거
        
        // 현재 열려있는 스팟 인덱스까지 반복하여 선 추가 (초기가 -1이므로 안 열렸으면 아예 안 그려짐)
        for (let i = 0; i <= unlockedSpotIndex; i++) {
            if (dynamicMapPaths[i]) {
                pathGroup.innerHTML += dynamicMapPaths[i];
            }
        }
    }

    function openDetail(index) {
        if (index > unlockedSpotIndex) return;
        currentSpotIndex = index;
        const spot = tourData[index];

        storyContainer.classList.remove('revealed');
        interactionZone.style.display = 'flex';
        storyText.innerHTML = "";
        storyText.classList.add('cursor-pointer');
        storyText.title = "클릭하여 텍스트 모두 보기 (스킵)";
        currentStoryHtml = spot.text;
        isTyping = false;
        clearTypingTimeouts();
        stopTypingSound(); 
        nextSpotBtn.style.display = 'none';
        
        detailHero.style.backgroundColor = spot.color;
        
        if (spot.color === "#40b049") {
            detailTitle.className = "text-2xl font-black text-white relative z-10 text-center px-4 drop-shadow-sm";
            detailSubtitle.className = "text-white mt-2 font-semibold relative z-10 bg-black bg-opacity-20 px-3 py-0.5 rounded-full text-sm";
        } else {
            detailTitle.className = "text-2xl font-black text-gray-900 relative z-10 text-center px-4";
            detailSubtitle.className = "text-gray-700 mt-2 font-medium relative z-10 bg-white bg-opacity-50 px-3 py-0.5 rounded-full text-sm";
        }

        detailImg.style.display = 'block';
        detailImg.src = spot.imageName;
        detailImgFallback.style.display = 'none';
        detailImgFallback.innerHTML = spot.id;
        detailTitle.innerHTML = spot.title;
        detailSubtitle.innerHTML = spot.subtitle;

        homePage.classList.remove('page-active');
        homePage.classList.add('page-hidden-left');
        detailPage.classList.remove('page-hidden-right');
        detailPage.classList.add('page-active');
    }

    function navigateBack() {
        clearTypingTimeouts();
        stopTypingSound(); 
        isTyping = false;
        detailPage.classList.remove('page-active');
        detailPage.classList.add('page-hidden-right');
        homePage.classList.remove('page-hidden-left');
        homePage.classList.add('page-active');
    }

    function revealStory() {
        initAudio();
        interactionZone.style.display = 'none';
        storyContainer.classList.add('revealed');
        setTimeout(() => { startTypewriter(currentStoryHtml); }, 300);
    }

    function clearTypingTimeouts() {
        typeTimeouts.forEach(clearTimeout);
        typeTimeouts = [];
    }

    function startTypewriter(html) {
        isTyping = true;
        storyText.innerHTML = '';
        startTypingSound(); 
        
        let tokens = html.match(/(<.*?>|[^<]+)/g); 
        if(!tokens) { onTypewriterComplete(); return; }
        
        let tokenIndex = 0, charIndex = 0, currentHtml = '';
        const baseTypingSpeed = 30; 

        function type() {
            if (!isTyping) return;
            if (tokenIndex >= tokens.length) { onTypewriterComplete(); return; }

            let token = tokens[tokenIndex];
            if (token.startsWith('<')) {
                currentHtml += token;
                storyText.innerHTML = currentHtml;
                tokenIndex++;
                type(); 
            } else {
                if (charIndex < token.length) {
                    currentHtml += token.charAt(charIndex);
                    storyText.innerHTML = currentHtml + '<span class="inline-block w-1 h-4 ml-0.5 align-middle bg-gray-500 animate-pulse"></span>'; 
                    charIndex++;
                    const scrollArea = document.querySelector('.scrollable-area');
                    if(scrollArea) scrollArea.scrollTop = scrollArea.scrollHeight;
                    
                    const humanizeDelay = Math.floor(Math.random() * 20);
                    typeTimeouts.push(setTimeout(type, baseTypingSpeed + humanizeDelay));
                } else {
                    charIndex = 0; tokenIndex++; type();
                }
            }
        }
        type();
    }

    storyText.onclick = function() {
        if (isTyping) {
            isTyping = false;
            clearTypingTimeouts();
            stopTypingSound(); 
            storyText.innerHTML = currentStoryHtml;
            onTypewriterComplete();
            setTimeout(() => {
                const scrollArea = document.querySelector('.scrollable-area');
                if(scrollArea) scrollArea.scrollTop = scrollArea.scrollHeight;
            }, 50);
        }
    };

    function onTypewriterComplete() {
        isTyping = false;
        stopTypingSound(); 
        storyText.classList.remove('cursor-pointer');
        storyText.title = "";
        storyText.innerHTML = currentStoryHtml; 
        
        if (currentSpotIndex < tourData.length - 1) {
            nextSpotBtn.style.display = 'flex';
            nextSpotBtn.style.opacity = '0';
            nextSpotBtn.style.transform = 'translateY(10px)';
            setTimeout(() => {
                nextSpotBtn.style.transition = 'all 0.4s ease';
                nextSpotBtn.style.opacity = '1';
                nextSpotBtn.style.transform = 'translateY(0)';
            }, 50);
        } else {
            nextSpotBtn.style.display = 'none';
        }
        
        setTimeout(() => {
             const scrollArea = document.querySelector('.scrollable-area');
             if(scrollArea) scrollArea.scrollTo({ top: scrollArea.scrollHeight, behavior: 'smooth' });
        }, 100);
    }

    function goToNextSpot() {
        if (currentSpotIndex < tourData.length - 1) {
            if (currentSpotIndex + 1 <= unlockedSpotIndex) {
                detailPage.style.opacity = '0';
                setTimeout(() => {
                    openDetail(currentSpotIndex + 1);
                    detailPage.style.opacity = '1';
                }, 300);
            } else {
                alert("다음 장소로 이동하여 NFC 태그를 스캔해주세요! 🐾");
            }
        }
    }

    // --- 4. Modal 로직 (NFC & MAP) ---
    function openNFCGuide() {
        document.getElementById('nfc-modal').classList.remove('hidden');
        document.getElementById('nfc-modal').classList.add('flex');
    }
    function closeNFCGuide() {
        document.getElementById('nfc-modal').classList.add('hidden');
        document.getElementById('nfc-modal').classList.remove('flex');
    }

    function openMap() {
        // 맵 오픈 시 최신 데이터로 업데이트를 보장함
        updateDynamicMapPath(); 
        
        document.getElementById('map-modal').classList.remove('hidden');
        document.getElementById('map-modal').classList.add('flex');
    }
    
    function closeMap() {
        document.getElementById('map-modal').classList.add('hidden');
        document.getElementById('map-modal').classList.remove('flex');
    }

    let mapZoomLevel = 100; // 초기 줌 (100%)
    function zoomMap(direction) {
        const mapWrapper = document.getElementById('map-zoom-wrapper');
        
        if (direction === 'in') {
            mapZoomLevel = Math.min(300, mapZoomLevel + 50); // 최대 300%
        } else if (direction === 'out') {
            mapZoomLevel = Math.max(100, mapZoomLevel - 50); // 최소 100%
        }
        
        mapWrapper.style.width = `${mapZoomLevel}%`;
    }

</script>

</body>
